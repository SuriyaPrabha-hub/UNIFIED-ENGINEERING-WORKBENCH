<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mcuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="fpgaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </linearGradient>
    <linearGradient id="jtagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="lsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4ade80"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#facc15"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="475" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="1">MODULAR HOST-CONNECTED WORKBENCH HARDWARE ARCHITECTURE</text>
  <text x="475" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">Power Distribution, Voltage Domains, Level Shifting & JTAG Debug Ownership</text>

  <!-- HOST WORKSTATION BOX -->
  <rect x="40" y="90" width="220" height="420" rx="12" fill="url(#hostGrad)" stroke="#3b82f6" stroke-width="2"/>
  <rect x="55" y="105" width="190" height="34" rx="6" fill="#3b82f6" fill-opacity="0.2"/>
  <text x="150" y="127" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="700">HOST WORKSTATION</text>
  <text x="150" y="160" text-anchor="middle" fill="#cbd5e1" font-size="11">Windows 11 x64 PC</text>
  
  <rect x="55" y="185" width="190" height="60" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="150" y="208" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Unified Workbench App</text>
  <text x="150" y="228" text-anchor="middle" fill="#94a3b8" font-size="10">C++17 Engine + React/Three.js</text>

  <!-- USB Hub controller in Host -->
  <rect x="55" y="270" width="190" height="210" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="150" y="295" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">USB 2.0/3.0 Root Hub</text>
  
  <rect x="70" y="315" width="160" height="36" rx="4" fill="#1e293b" stroke="#3b82f6"/>
  <text x="150" y="337" text-anchor="middle" fill="#93c5fd" font-size="11">Port 1: USB CDC-ACM (MCU)</text>

  <rect x="70" y="365" width="160" height="36" rx="4" fill="#1e293b" stroke="#c084fc"/>
  <text x="150" y="387" text-anchor="middle" fill="#e9d5ff" font-size="11">Port 2: FTDI FIFO (FPGA)</text>

  <rect x="70" y="415" width="160" height="36" rx="4" fill="#1e293b" stroke="#4ade80"/>
  <text x="150" y="437" text-anchor="middle" fill="#bbf7d0" font-size="11">Port 3: High-Speed JTAG</text>

  <!-- POWER BUS (5.0V VBUS + GND) -->
  <path d="M 230 333 L 340 333" stroke="#facc15" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="285" y="325" text-anchor="middle" fill="#facc15" font-size="9">5V VBUS</text>

  <!-- MICROCONTROLLER BOARD -->
  <rect x="340" y="100" width="250" height="170" rx="12" fill="url(#mcuGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="465" y="128" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">STM32H743ZI (MCU)</text>
  <rect x="360" y="142" width="210" height="22" rx="4" fill="#1e40af"/>
  <text x="465" y="157" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="600">VOLTAGE DOMAIN: 3.3V Logic (VDD)</text>

  <text x="365" y="185" fill="#e2e8f0" font-size="11">• ARM Cortex-M7 @ 480 MHz</text>
  <text x="365" y="202" fill="#e2e8f0" font-size="11">• Direct USB-UART Virtual COM Port</text>
  <text x="365" y="219" fill="#e2e8f0" font-size="11">• 3.3V High-Speed SPI Master Bus</text>
  <text x="365" y="236" fill="#e2e8f0" font-size="11">• SWD/JTAG 10-Pin Header (Slave)</text>

  <!-- LEVEL SHIFTER INTERMEDIARY -->
  <rect x="630" y="140" width="110" height="90" rx="8" fill="url(#lsGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="685" y="165" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">LEVEL SHIFTER</text>
  <text x="685" y="182" text-anchor="middle" fill="#fcd34d" font-size="10">TI TXS0108E</text>
  <text x="685" y="202" text-anchor="middle" fill="#fef3c7" font-size="9">3.3V &lt;--&gt; 1.8V</text>
  <text x="685" y="217" text-anchor="middle" fill="#fef3c7" font-size="8">Bidirectional Auto</text>

  <!-- Connection: MCU to Level Shifter -->
  <line x1="590" y1="185" x2="630" y2="185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="177" text-anchor="middle" fill="#38bdf8" font-size="8">3.3V SPI</text>

  <!-- Connection: Level Shifter to FPGA -->
  <line x1="740" y1="185" x2="770" y2="185" stroke="#facc15" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <text x="755" y="177" text-anchor="middle" fill="#facc15" font-size="8">1.8V SPI</text>

  <!-- FPGA BOARD -->
  <rect x="770" y="100" width="160" height="230" rx="12" fill="url(#fpgaGrad)" stroke="#c084fc" stroke-width="2"/>
  <text x="850" y="128" text-anchor="middle" fill="#e9d5ff" font-size="13" font-weight="700">Artix-7 (FPGA)</text>
  <rect x="780" y="140" width="140" height="28" rx="4" fill="#581c87"/>
  <text x="850" y="152" text-anchor="middle" fill="#f5d0fe" font-size="9" font-weight="600">VOLTAGE DOMAIN:</text>
  <text x="850" y="164" text-anchor="middle" fill="#f5d0fe" font-size="8">1.8V Bank / 1.0V Core</text>

  <text x="780" y="195" fill="#f3e8ff" font-size="10">• 101k Logic Cells</text>
  <text x="780" y="212" fill="#f3e8ff" font-size="10">• FT2232H USB/SPI</text>
  <text x="780" y="229" fill="#f3e8ff" font-size="10">• 1.8V Pmod Headers</text>
  <text x="780" y="246" fill="#f3e8ff" font-size="10">• Dedicated JTAG Tap</text>
  <text x="780" y="265" fill="#f87171" font-size="9" font-weight="700">! 3.3V Overvoltage Risk</text>
  <text x="780" y="278" fill="#fca5a5" font-size="8">Requires Isolation</text>

  <!-- JTAG DEBUG ADAPTER -->
  <rect x="340" y="340" width="310" height="170" rx="12" fill="url(#jtagGrad)" stroke="#4ade80" stroke-width="2"/>
  <text x="495" y="368" text-anchor="middle" fill="#86efac" font-size="14" font-weight="700">SEGGER J-Link / ST-Link V3 Probe</text>
  <rect x="360" y="380" width="270" height="24" rx="4" fill="#14532d"/>
  <text x="495" y="396" text-anchor="middle" fill="#bbf7d0" font-size="10" font-weight="600">TARGET SENSE VTref: 1.2V - 5.0V AUTO-TRACKING</text>

  <text x="365" y="425" fill="#dcfce7" font-size="11">• Master TAP Controller (Owns TCK, TMS, TDI, TDO, nSRST)</text>
  <text x="365" y="443" fill="#dcfce7" font-size="11">• IEEE 1149.1 Boundary Scan / ARM 2-Wire SWD</text>
  <text x="365" y="461" fill="#dcfce7" font-size="11">• Hardware Core Halt, Register Peek/Poke & Flash Loader</text>
  <text x="365" y="480" fill="#fef08a" font-size="10" font-weight="600">CRITICAL: Debug Interface ONLY - Not a generic compute node</text>

  <!-- JTAG Debug Harness Lines to MCU and FPGA -->
  <path d="M 495 340 L 495 270" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="502" y="310" fill="#4ade80" font-size="9">SWD (3.3V)</text>

  <path d="M 650 425 L 850 425 L 850 330" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowGreen)"/>
  <text x="750" y="415" fill="#4ade80" font-size="9">JTAG Boundary Chain (1.8V)</text>

  <!-- COMMON STAR GROUND BUS -->
  <line x1="150" y1="510" x2="850" y2="510" stroke="#64748b" stroke-width="4"/>
  <text x="500" y="535" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">COMMON STAR GROUND INTEGRITY BUS (0.0V REFERENCE)</text>
</svg>
